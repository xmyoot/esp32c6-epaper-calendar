name: Validate project
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Checks checked-in release identity and BOM/CPL agreement; not fresh ERC/DRC.
      - run: python scripts/check_release.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install "GxEPD2@1.6.9" "Adafruit GFX Library@1.12.6" "Adafruit BusIO@1.17.4"
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32C6 firmware/EPDCalendar
